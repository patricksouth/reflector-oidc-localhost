services:
  httpd:
    container_name: reflector
    image: "${IMAGE_NAME:?IMAGE_NAME is required}:${PHP_IMAGE_VER}-${OIDC_VER}-${RELEASE}"
    volumes:
      - ./public-html:/var/www/html
#      - ./oauth-console:/var/www/html
      - ./src/server.crt:/etc/ssl/certs/server.crt:ro
      - ./src/server.key:/etc/ssl/private/server.key:ro
      - ./src/000-webserver.conf:/etc/apache2/sites-available/000-webserver.conf:ro
      - ./src/auth_openidc.conf:/etc/apache2/conf-available/auth_openidc.conf:ro
#      - ${PWD}/logs:/var/log/apache2/
    ports:
      - "127.0.0.1:${HTTP_PORT:?HTTP_PORT is required}:80"
      - "127.0.0.1:${HTTPS_PORT:?HTTPS_PORT is required}:443"
